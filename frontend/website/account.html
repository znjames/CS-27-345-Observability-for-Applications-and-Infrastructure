<!DOCTYPE html>
<html>

<head>
    <title>CapitalTwo Account Page</title>
</head>

<body>
    <h2>Account Detail</h2>
    <p> Current Balance is: <span id = "balance"></span></p>

    <h3>Transactions</h3>
    <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="0.01">
    <button onclick="deposit()">Deposit</button>
    <button onclick="withdraw()">Withdraw</button>
    <p id="message"></p>
    

    <h3>Transaction History</h3>
    <table id="history" border="1">
        <thead>
            <tr>
                <th>Date</th>
                <th>Type</th>
                <th>Amount</th>
                <th>Balance After</th>
            </tr>
        </thead>
        <tbody id="history-body"></tbody>
    </table>
    <p id="no-history" style="display:none">No transactions yet.</p>




    <p><a href="index.html">Home</a></p>
    <script src="account.js"></script>
</body>

</html>
